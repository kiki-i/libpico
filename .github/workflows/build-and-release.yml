name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: echo "build-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Clang (Windows)
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-clang@v2

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -S ${{ github.workspace }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C ${{ steps.strings.outputs.build-dir }}

      - name: Upload build artifacts (Linux)
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.os }}
          path: ${{ steps.strings.outputs.build-dir }}/*.so

      - name: Upload build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.os }}
          path: ${{ steps.strings.outputs.build-dir }}/*.dll

  release:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
